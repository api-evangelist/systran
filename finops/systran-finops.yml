meters:
- name: characters_translated
  description: Characters translated across text, HTML, and file translation, the primary billing meter.
  unit: characters
  aggregation: sum
  dimensions:
  - account
  - profile
  - language_pair
- name: file_jobs
  description: Asynchronous file translation jobs submitted and processed.
  unit: jobs
  aggregation: sum
  dimensions:
  - account
  - profile
- name: nlp_requests
  description: NLP and language-detection calls (morphology, tokenization, segmentation, NER, LID) on the Platform surface.
  unit: requests
  aggregation: sum
  dimensions:
  - account
  - operation
- name: seat_subscriptions
  description: Professional SaaS seats subscribed on a monthly/annual basis.
  unit: seats
  aggregation: max
  dimensions:
  - account
principles:
- name: Visibility
  description: Track characters translated per profile and language pair, plus file-job and NLP request volumes, against the plan's character allowance.
- name: Allocation
  description: Name profiles per workload/team so translated-character cost maps to internal cost centers.
- name: Optimization
  description: Use translation-memory corpora and user dictionaries to avoid re-translating repeated content, batch file jobs, and consider on-premise deployment when volume is very high.
- name: Accountability
  description: Assign owners per profile and review monthly character consumption against subscription allowances and trial limits.
