description: >-
  FinOps view of SYSTRAN spend. SYSTRAN Translate is billed primarily on
  characters translated. Developers start with a 14-day free trial including
  500,000 characters, then pay per character with no volume restrictions on the
  Cloud API. Professional is a seat-based SaaS subscription and Enterprise covers
  Cloud and on-premise deployments under negotiated agreements. The dominant cost
  driver for programmatic use is translated character volume across text, HTML,
  and file translation; NLP, dictionary, corpus, and profile management operations
  support that volume. On-premise / Pure Neural Server deployments trade
  per-character fees for licensed infrastructure.
notes: >-
  Per-character list rates and marketplace subscription tiers are not reconciled
  here; verify on the SYSTRAN store and Translate API product page. Track character
  consumption per profile/language pair to allocate cost, and prefer batching and
  translation memory (corpora) to avoid re-translating repeated content.
