actions:
  asyncapiPath: null
  apisYmlUpdated: true
  reason: |
    No WebSocket protocol surface exists on SYSTRAN's public API. The Translate
    API and the Platform/SYSTRAN.io NLP surface are request/response REST over
    HTTPS, with asynchronous document translation handled by a submit-then-poll
    REST pattern. No AsyncAPI document was created because there is no
    server-push transport (WebSocket or SSE) on SYSTRAN's own API to model.
