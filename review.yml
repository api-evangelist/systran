aid: systran
name: SYSTRAN
review:
  question: Does SYSTRAN expose a documented public WebSocket API?
  answer: false
  date: '2026-07-03'
  reviewer: API Evangelist
  asyncapiSpecCreated: false
  asyncapiScopeNote: |
    No AsyncAPI document was authored. SYSTRAN's public API surface - the
    Translate API (https://api-translate.systran.net) and the SYSTRAN.io /
    Platform NLP surface (https://api-platform.systran.net) - is entirely
    request/response REST over HTTPS. There is no documented server-push
    transport (WebSocket or SSE) on SYSTRAN's own API to model. Long-running
    document translation is handled by an asynchronous submit-then-poll REST
    pattern (async=true, then GET /translation/file/status by requestId), not
    by a streaming socket.
findings:
  summary: |
    SYSTRAN does not publish a documented public WebSocket API. SYSTRAN is a
    machine translation and NLP provider. Its public developer surface is the
    RESTful SYSTRAN Translate API at https://api-translate.systran.net (text,
    HTML, and file translation, supported-language discovery, dictionaries,
    corpora, and profiles) plus the SYSTRAN.io / Platform NLP surface at
    https://api-platform.systran.net (language detection, morphology,
    tokenization, segmentation, named entity recognition). All operations are
    request/response REST over HTTPS, authenticated with an API key passed as
    the `key` query parameter or an Authorization header. Asynchronous file
    translation uses async=true followed by polling GET /translation/file/status
    by requestId until finished, then GET /translation/file/result - a REST poll
    loop, not a WebSocket. No realtime, bidirectional, or streaming WebSocket
    (ws:// or wss://) endpoint is documented on SYSTRAN's public API.
  transports:
    - protocol: REST
      scheme: https
      baseURL: https://api-translate.systran.net
      documented: true
      note: SYSTRAN Translate API - translation, file, supported languages, dictionary, corpus, profiles. Request/response only.
    - protocol: REST
      scheme: https
      baseURL: https://api-platform.systran.net
      documented: true
      note: SYSTRAN.io / Platform NLP surface - language detection and NLP operations. Request/response only.
    - protocol: HTTP Poll
      scheme: https
      documented: true
      note: Async file translation submitted with async=true and polled via GET /translation/file/status by requestId. Client-initiated polling, not server push.
    - protocol: WebSocket
      scheme: wss
      documented: false
      note: No WebSocket endpoint is documented anywhere in the SYSTRAN Translate API reference or the Platform/SYSTRAN.io NLP documentation as of the review date.
